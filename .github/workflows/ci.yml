name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0
      - run: |
          node --check prototype/app.js
          node --check prototype/model.js
          node --check prototype/server.cjs
          npm --prefix prototype test

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.9.5
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Frozen dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Quality, contract and foundation tests
        working-directory: backend
        run: |
          uv run --frozen ruff check app tests migrations ../scripts
          uv run --frozen ruff format --check app tests migrations ../scripts
          uv run --frozen mypy app
          uv run --frozen pytest -m 'not integration' --junitxml=../test-results/backend.xml
          uv run --frozen python -c 'from app.main import app as api; import app.worker.__main__; assert api.openapi()'
          uv run --frozen python ../scripts/check-doc-links.py
          uv run --frozen python ../scripts/generate-client-types.py --check
          uv run --frozen python -m unittest discover -s ../scripts/tests -v
      - name: Validate Actions syntax
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/ci.yml
          bash -n scripts/ci-compose.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: backend-tests
          path: test-results/*.xml
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          node --test tests/assets.test.mjs

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: soc-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SOC_API_PORT: '18000'
      SOC_WEB_PORT: '13000'
      SOC_DB_PORT: '55438'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: python scripts/init-local.py
      - name: Browser test dependencies
        run: |
          npm install --global npm@11.19.0
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - run: bash scripts/ci-compose.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: integration-tests
          path: test-results/*.xml
          retention-days: 14
          if-no-files-found: ignore

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [prototype, backend, frontend, integration]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Require every result to be success
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py prototype backend frontend integration
