[project]
name = "soc-backend"
version = "0.1.0"
description = "SOC API and worker scaffold; domain features are not implemented."
requires-python = "==3.12.14"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "sqlalchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "pyyaml==6.0.3",
  "types-pyyaml==6.0.12.20260906",
  "openapi-spec-validator==0.9.0",
]

[tool.uv]
required-version = "==0.9.5"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
