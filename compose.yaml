name: soc-local

x-backend: &backend
  image: soc-backend:local
  build:
    context: ./backend
    target: base

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: soc

services:
  db:
    image: soc-postgres-vector:local
    build:
      context: ./infra
      dockerfile: Dockerfile.pgvector
    environment:
      POSTGRES_DB: soc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres]
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${SOC_DB_PORT:-55432}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d soc"]
      interval: 3s
      timeout: 3s
      retries: 30

  bootstrap:
    <<: *backend
    command: [python, -m, app.db.bootstrap]
    environment:
      <<: *db-env
      DB_PASSWORD_FILE: /run/secrets/postgres
      ROLE_SECRETS_DIR: /role-secrets
      SOC_INSTALL_VECTOR: "yes"
    secrets: [postgres]
    volumes: [./.local/secrets:/role-secrets:ro]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  migrate:
    <<: *backend
    command: [python, -m, app.db.migrate]
    environment:
      <<: *db-env
      DB_PASSWORD_FILE: /run/secrets/migration_owner
      RELEASE_SHA: ${RELEASE_SHA:-local}
    secrets: [migration_owner]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: "no"

  seed:
    image: soc-seed:local
    build:
      context: ./backend
      target: seed
    environment:
      <<: *db-env
      DB_PASSWORD_FILE: /run/secrets/migration_owner
    secrets: [migration_owner]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *db-env
      DB_PASSWORD_FILE: /run/secrets/api_runtime
      SOC_KB_ENABLED: ${SOC_KB_ENABLED:-false}
      AUTH_COOKIE_SECURE: "false"
      AUTH_ORIGINS: http://127.0.0.1:${SOC_WEB_PORT:-3000},http://localhost:${SOC_WEB_PORT:-3000}
      SOC_AI_PROVIDER: ${SOC_AI_PROVIDER:-mock}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: ${GOOGLE_OAUTH_CLIENT_SECRET_FILE:-}
      GEMINI_PROJECT_TIER_CONFIRMED: ${GEMINI_PROJECT_TIER_CONFIRMED:-}
      GEMINI_SYNTHETIC_DATA_ONLY: ${GEMINI_SYNTHETIC_DATA_ONLY:-true}
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      SOC_RAG_REAL_CONFIRMED: ${SOC_RAG_REAL_CONFIRMED:-}
    secrets: [api_runtime]
    ports: ["127.0.0.1:${SOC_API_PORT:-8000}:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 5

  worker:
    image: soc-worker:local
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    command: [python, -m, app.worker]
    environment:
      <<: *db-env
      DB_PASSWORD_FILE: /run/secrets/worker_runtime
      SOC_AI_PROVIDER: ${SOC_AI_PROVIDER:-mock}
      GEMINI_PROJECT_TIER_CONFIRMED: ${GEMINI_PROJECT_TIER_CONFIRMED:-}
      GEMINI_SYNTHETIC_DATA_ONLY: ${GEMINI_SYNTHETIC_DATA_ONLY:-true}
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      SOC_RAG_REAL_CONFIRMED: ${SOC_RAG_REAL_CONFIRMED:-}
    secrets: [worker_runtime, gemini_api_key]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, app.worker, --check]
      interval: 30s
      timeout: 8s
      retries: 3

  evaluator:
    image: soc-worker:local
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    command: [python, -m, app.evaluation]
    environment:
      <<: *db-env
      DB_PASSWORD_FILE: /run/secrets/evaluator_runtime
    secrets: [evaluator_runtime]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, app.evaluation, --check]
      interval: 30s
      timeout: 8s
      retries: 3

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${SOC_WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 5

  provision:
    <<: *backend
    profiles: [tools]
    entrypoint: [python, -m, app.db.provision]
    environment:
      <<: *db-env
      DB_PASSWORD_FILE: /run/secrets/migration_owner
    secrets: [migration_owner]
    depends_on:
      migrate: {condition: service_completed_successfully}

  test-db:
    image: soc-postgres-vector:local
    build:
      context: ./infra
      dockerfile: Dockerfile.pgvector
    profiles: [test]
    environment:
      POSTGRES_DB: soc_test_foundation
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d soc_test_foundation"]
      interval: 3s
      timeout: 3s
      retries: 30

  test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      SOC_TEST_DB_HOST: test-db
      SOC_TEST_DB_PORT: "5432"
      SOC_TEST_DB_NAME: soc_test_foundation
      SOC_TEST_SECRETS_DIR: /role-secrets
      SOC_TEST_ALLOW_RESET: "yes"
    volumes:
      - ./.local/secrets/postgres.txt:/role-secrets/postgres.txt:ro
      - ./.local/secrets/migration_owner.txt:/role-secrets/migration_owner.txt:ro
      - ./.local/secrets/api_runtime.txt:/role-secrets/api_runtime.txt:ro
      - ./.local/secrets/worker_runtime.txt:/role-secrets/worker_runtime.txt:ro
      - ./.local/secrets/evaluator_runtime.txt:/role-secrets/evaluator_runtime.txt:ro
      - ./.local/secrets/retention_runtime.txt:/role-secrets/retention_runtime.txt:ro
    depends_on:
      test-db: {condition: service_healthy}

volumes:
  postgres-data:

secrets:
  postgres: {file: ./.local/secrets/postgres.txt}
  migration_owner: {file: ./.local/secrets/migration_owner.txt}
  api_runtime: {file: ./.local/secrets/api_runtime.txt}
  worker_runtime: {file: ./.local/secrets/worker_runtime.txt}
  evaluator_runtime: {file: ./.local/secrets/evaluator_runtime.txt}
  gemini_api_key: {file: ./.local/secrets/gemini_api_key.txt}
