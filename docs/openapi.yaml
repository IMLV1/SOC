  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: soc_session
      description: 'Opaque soc_session cookie: HttpOnly, Secure, SameSite=Lax, Path=/.
        Explicit loopback HTTP development may disable Secure.'
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Scope user+method+resource path; authorization before cache. Same
        body replays, different body 409; at least 24h and until job terminal.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    DomainError:
      description: Sanitized error envelope. 401 session; 403 role/CSRF; 404 missing
        or out of scope; 409 state/version/policy; 422 validation; 429 quota; 503
        unavailable. Never reflect secrets, answer keys or raw input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainErrorEnvelope'
servers:
- url: /
  description: Same-origin API; domain paths include /api/v1.
x-decision-register: srs.md#8-decision-register--ยังไม่ตัดสินแทนผู้ใช้
x-exam-policy:
  training_creation: POST /runs accepts training catalog only; server sets immutable
    mode.
  finish: training only; exam returns 409 EXAM_SUBMIT_REQUIRED
  learner_truth: never expose full exam answer key; rubric feedback only after submission
  instructor_truth: assignment + access audit + submitted exam required
  hints: deny triage, questions, retries, sources and nested hints before submit
  serialization: explicit exam allowlist on all projections; never reuse training
    DTO
  lock_order:
  - user_guard
  - idempotency
  - run
  - attempt
  - ticket/note/analysis/progression
  - sorted_quota_ledgers
